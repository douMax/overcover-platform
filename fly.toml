# fly.toml app configuration for Overcover
# See https://fly.io/docs/reference/configuration/

app = 'overcover-platform'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  # DATA_DIR = '/data'   # content store, see [mounts] below

# Content store (SQLite) — only needed once the `contentService` toggle in
# backend/src/config/features.ts is on for production. To enable:
#   1. fly volumes create overcover_data --region syd --size 1
#   2. uncomment DATA_DIR above and the [mounts] block below, then deploy
# A volume attaches to a single machine, which also keeps the app at exactly one machine.
# [mounts]
#   source = 'overcover_data'
#   destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Rooms live in memory: suspend (not stop) keeps them when the machine idles
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
